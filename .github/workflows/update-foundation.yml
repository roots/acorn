name: Update Laravel Foundation

on:
  schedule:
    - cron: '17 9 * * 3'
  workflow_dispatch:

permissions: {}

concurrency:
  group: update-foundation
  cancel-in-progress: false

jobs:
  update-foundation:
    runs-on: ubuntu-latest

    permissions:
      contents: write
      pull-requests: write

    env:
      BRANCH: update/foundation
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: curl, phar

      - name: Find open pull request
        id: pr
        run: |
          NUMBER=$(gh pr list --head "$BRANCH" --state open --json number,isCrossRepository \
            --jq '[.[] | select(.isCrossRepository | not)][0].number // empty')

          echo "number=${NUMBER}" >> "$GITHUB_OUTPUT"

      - name: Switch to update branch
        env:
          PR_NUMBER: ${{ steps.pr.outputs.number }}
        run: |
          if [ -n "$PR_NUMBER" ]; then
            git fetch --depth=1 origin "+refs/heads/${BRANCH}:refs/remotes/origin/${BRANCH}"
            git checkout -B "$BRANCH" "origin/${BRANCH}"
          else
            git fetch --depth=1 origin "+refs/heads/main:refs/remotes/origin/main"
            git checkout -B "$BRANCH" origin/main
          fi

      - name: Run update script
        run: php scripts/update-foundation

      - name: Validate version
        id: version
        run: |
          if [ ! -f scripts/.laravel-version ]; then
            echo "synced=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          VERSION=$(cat scripts/.laravel-version)

          if [[ ! "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Unexpected Laravel version: ${VERSION}"
            exit 1
          fi

          echo "synced=true" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Raise illuminate/* minimums
        if: steps.version.outputs.synced == 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          # shellcheck disable=SC2016 # PHP code, not shell
          php -r '
            [$major, $minor, $patch] = explode(".", ltrim(getenv("VERSION"), "v"));
            $json = file_get_contents("composer.json");

            $json = preg_replace_callback(
                "/\"(illuminate\/[a-z-]+)\": \"\^(\d+)\.(\d+)\.(\d+)\"/",
                function ($m) use ($major, $minor, $patch) {
                    $current = "{$m[2]}.{$m[3]}.{$m[4]}";
                    $new = "{$major}.{$minor}.{$patch}";

                    if ($m[2] !== $major || version_compare($new, $current, "<=")) {
                        return $m[0];
                    }

                    return "\"{$m[1]}\": \"^{$new}\"";
                },
                $json,
            );

            if ($json === null) {
                exit(1);
            }

            file_put_contents("composer.json", $json);
          '

      - name: Check for changes
        id: changes
        if: steps.version.outputs.synced == 'true'
        run: |
          if git diff --quiet; then
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          else
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Check upstream config changes
        if: steps.changes.outputs.has_changes == 'true'
        timeout-minutes: 5
        continue-on-error: true
        env:
          VERSION: ${{ steps.version.outputs.version }}
          NOTE: ${{ runner.temp }}/config-note.md
        run: |
          set -o pipefail

          # Acorn's config/ follows Laravel's, so list upstream config changes since main's Foundation version.
          changes() {
            timeout 120 git fetch --depth=1 origin "+refs/heads/main:refs/remotes/origin/main" &&
            OLD=$(git show origin/main:src/Illuminate/Foundation/Application.php | grep -oE "VERSION = '[0-9]+\.[0-9]+\.[0-9]+'" | grep -oE '[0-9]+\.[0-9]+\.[0-9]+') &&
            [ -n "$OLD" ] || return 1

            TMP=$(mktemp -d) &&
            git -C "$TMP" init -q &&
            timeout 120 git -C "$TMP" fetch -q --depth=1 --no-tags https://github.com/laravel/framework.git \
              "+refs/tags/v${OLD}:refs/old" "+refs/tags/${VERSION}:refs/new" &&
            DIFF=$(git -C "$TMP" diff --name-only refs/old refs/new -- config/) &&
            FILES=$(printf '%s\n' "$DIFF" | grep -E '^config/[A-Za-z0-9_.-]+$' || true) &&
            SINCE=$(git -C "$TMP" log -1 --format=%cs refs/old) &&
            UNTIL=$(git -C "$TMP" log -1 --format=%cs refs/new) || return 1

            MAJOR="${VERSION%%.*}"
            SKELETON="https://github.com/laravel/laravel/commits/${MAJOR#v}.x/config?since=${SINCE}&until=${UNTIL}"

            if [ -z "$FILES" ]; then
              echo "No upstream config changes in laravel/framework since \`v${OLD}\`. Also check [laravel/laravel](${SKELETON})."
              return
            fi

            echo "Upstream config changes since \`v${OLD}\` (Acorn's config intentionally differs in places, so only port what applies):"
            # shellcheck disable=SC2016 # literal backticks for Markdown
            echo "- [laravel/framework](https://github.com/laravel/framework/compare/v${OLD}...${VERSION}): $(echo "$FILES" | sed 's/.*/`&`/' | paste -sd, - | sed 's/,/, /g')"
            echo "- [laravel/laravel](${SKELETON})"
          }

          if ! changes > "$NOTE"; then
            echo "Couldn't check upstream config changes." > "$NOTE"
          fi

          cat "$NOTE"

      - name: Commit and push
        if: steps.changes.outputs.has_changes == 'true'
        env:
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add src/Illuminate/Foundation/ composer.json
          git commit -m "📦️ Update Foundation to Laravel ${VERSION}"

          if [ -n "$PR_NUMBER" ]; then
            git push origin "$BRANCH"
          else
            git push --force -u origin "$BRANCH"
          fi

      - name: Create or update pull request
        if: steps.changes.outputs.has_changes == 'true'
        env:
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          VERSION: ${{ steps.version.outputs.version }}
          NOTE: ${{ runner.temp }}/config-note.md
        run: |
          TITLE="📦️ Update Foundation to Laravel ${VERSION}"
          BODY="This is an automated PR to update \`Illuminate\Foundation\` to Laravel \`${VERSION}\` and raise the \`illuminate/*\` minimums to match (same major version only).

          Approve the workflow runs to start CI, sync Acorn's overrides with any upstream changes, and ensure compatibility with Acorn before merging.

          $(cat "$NOTE" 2>/dev/null || true)"

          if [ -n "$PR_NUMBER" ]; then
            gh pr edit "$PR_NUMBER" --title "$TITLE" --body "$BODY"
          else
            gh pr create --base main --head "$BRANCH" --title "$TITLE" --body "$BODY" --label "dependencies"
          fi
